name: Refresh discovery dashboard

on:
  schedule:
    - cron: "0 13 * * 1-5"   # weekdays, 13:00 UTC (~morning US Mountain time)
  workflow_dispatch: {}       # allow manual "Run workflow" trigger

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline and rebuild dashboard
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 pipeline.py
          python3 build.py

      - name: Commit and push if data changed
        run: |
          git config user.name "discovery-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html dashboard.html
          git diff --cached --quiet && echo "No changes." || git commit -m "Refresh dashboard data"
          git push
